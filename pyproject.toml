[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "student-career-recommender"
version = "1.0.0"
description = "Explainable content-based ML career recommender for a student learning analytics platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3,<2",
    "numpy>=1.26,<3",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    "streamlit>=1.40,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
